name: Deploy to GitHub Pages

# Every push to main rebuilds the static site and publishes it to
# https://statonyicheng.github.io/cinderella-ledger-app/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          # Project sites are served under /<repo>; configure-pages reports the exact path.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Refuse to publish demo mode
        run: |
          if grep -rq "NEXT_PUBLIC_LEDGER_DEMO" out/_next/static; then
            echo "::error::Demo-mode flag found in the production bundle"; exit 1
          fi

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
